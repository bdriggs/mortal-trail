<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mortal Trail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0907;--panel:#14100c;--ink:#ece2c9;--dim:#9c8f75;--blood:#c3171d;--gold:#e6b422;--green:#7fd36b;--line:#3a2f22}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'VT323',monospace;font-size:22px;line-height:1.2}
#wrap{max-width:980px;margin:0 auto;padding:10px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 2px 8px}
header .logo{font-family:'Press Start 2P',monospace;font-size:13px;color:var(--blood);text-shadow:2px 2px 0 #000;letter-spacing:1px}
header .logo span{color:var(--gold)}
header .right{display:flex;gap:10px;align-items:center;color:var(--dim);font-size:19px}
.tbtn{font-family:'VT323',monospace;font-size:19px;background:#1d1711;color:var(--ink);border:2px solid var(--line);padding:2px 10px;cursor:pointer}
.tbtn:hover{border-color:var(--gold)}
#screen{position:relative;width:100%;aspect-ratio:16/9;background:#000;border:3px solid var(--line)}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
#panel{border:3px solid var(--line);border-top:none;background:var(--panel);padding:12px 16px 16px;min-height:210px}
#panel h2{font-family:'Press Start 2P',monospace;font-size:14px;color:var(--gold);margin:4px 0 10px;line-height:1.5}
#panel h2.red{color:var(--blood)}
#panel p{margin:0 0 10px}
.dim{color:var(--dim)} .gold{color:var(--gold)} .red{color:#ff4b4b} .grn{color:var(--green)}
.cols{display:grid;grid-template-columns:1.15fr 1fr;gap:18px}
@media(max-width:720px){.cols{grid-template-columns:1fr}}
.opts{display:flex;flex-direction:column;gap:6px}
button.opt{font-family:'VT323',monospace;font-size:22px;text-align:left;background:#1d1711;color:var(--ink);border:2px solid var(--line);padding:5px 10px;cursor:pointer;line-height:1.1}
button.opt:hover,button.opt:focus-visible{border-color:var(--gold);color:#fff;outline:none;background:#2a2016}
button.opt .k{color:var(--gold);margin-right:8px}
button.opt[disabled]{opacity:.38;cursor:default;border-color:var(--line);background:#1d1711;color:var(--ink)}
button.opt.hot{border-color:var(--blood)}
.note{border-left:4px solid var(--blood);padding:6px 10px;background:#1f0c0c;margin-bottom:10px}
.note.good{border-color:var(--green);background:#0f1a0c}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:2px 14px;margin-bottom:10px}
.stats b{color:var(--dim);font-weight:normal}
.party{display:grid;gap:3px;margin-bottom:10px}
.pm{display:grid;grid-template-columns:150px 1fr 96px;align-items:center;gap:8px}
.pm .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pm.dead{color:#6b5f4c;text-decoration:line-through}
.hb{height:10px;background:#2a2016;border:1px solid #000}
.hb i{display:block;height:100%}
.st{font-size:18px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st.sick{color:#ff8a3a}
.map{position:relative;height:30px;margin:4px 6px 12px}
.map .track{position:absolute;left:0;right:0;top:14px;border-top:2px dashed #5a4a34}
.map .done{position:absolute;left:0;top:13px;border-top:4px solid var(--gold)}
.map .lm{position:absolute;top:9px;width:10px;height:10px;margin-left:-5px;background:#5a4a34;border:1px solid #000}
.map .lm.boss{background:var(--blood);transform:rotate(45deg)}
.map .lm.past{background:var(--gold)}
.map .wg{position:absolute;top:-2px;margin-left:-8px;font-size:18px}
.log{font-size:19px;color:var(--dim);min-height:60px;margin-bottom:10px}
.log div:last-child{color:var(--ink)}
table.store{width:100%;border-collapse:collapse;margin-bottom:10px}
table.store td{padding:3px 6px;border-bottom:1px solid #2a2016}
table.store td.q{text-align:center;width:150px;white-space:nowrap}
table.store button{font-family:'VT323';font-size:22px;width:30px;background:#1d1711;color:var(--gold);border:2px solid var(--line);cursor:pointer}
table.store button:hover{border-color:var(--gold)}
.champs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
@media(max-width:720px){.champs{grid-template-columns:repeat(2,1fr)}}
.champ{background:#1d1711;border:2px solid var(--line);padding:8px;cursor:pointer;font-family:'VT323';font-size:20px;color:var(--ink);text-align:left}
.champ.sel{border-color:var(--gold);background:#2a2016}
.champ b{display:block;color:var(--gold);font-weight:normal;font-size:22px}
input.nm{font-family:'VT323';font-size:22px;background:#0b0907;color:var(--ink);border:2px solid var(--line);padding:4px 8px;width:100%}
input.nm:focus{outline:none;border-color:var(--gold)}
.names{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
kbd{font-family:'VT323';background:#2a2016;border:1px solid #5a4a34;padding:0 5px;color:var(--gold)}
.ctrl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:20px}
#touch{position:absolute;inset:0;pointer-events:none;display:none}
#touch.on{display:block}
#touch .pad{position:absolute;bottom:6px;display:flex;gap:6px;pointer-events:auto}
#touch .l{left:6px}#touch .r{right:6px}
#touch button{width:46px;height:40px;font-family:'Press Start 2P';font-size:11px;background:rgba(20,16,12,.55);color:#fff;border:2px solid rgba(230,180,34,.6);border-radius:6px;touch-action:none;user-select:none;-webkit-user-select:none}
footer{color:#5a4f40;font-size:17px;text-align:center;padding:8px}
</style>
</head>
<body>
<div id="wrap">
  <header>
    <div class="logo">MORTAL <span>TRAIL</span></div>
    <div class="right"><span id="best"></span><button class="tbtn" id="snd">Sound: on</button></div>
  </header>
  <div id="screen">
    <canvas id="cv"></canvas>
    <div id="touch">
      <div class="pad l"><button data-k="L">◀</button><button data-k="D">▼</button><button data-k="U">▲</button><button data-k="R">▶</button></div>
      <div class="pad r"><button data-k="P">P</button><button data-k="K">K</button><button data-k="S">S</button></div>
    </div>
  </div>
  <div id="panel"></div>
  <footer>A parody mash-up of covered-wagon survival and arcade fighting. All characters are original. Keys 1–9 pick options · Space continues · M mutes.</footer>
</div>
<script>
"use strict";
// ======================================================================
// Core setup
// ======================================================================
const W=384,H=216,GY=192,FS=1.45;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
cv.width=W;cv.height=H;ctx.imageSmoothingEnabled=false;
const panel=document.getElementById('panel');
const Rn=(a,b)=>a+Math.random()*(b-a);
const RI=(a,b)=>Math.floor(Rn(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
let FLASHCOL=null;

// ======================================================================
// Audio (synthesised, no files)
// ======================================================================
let AC=null,muted=false;
function audio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume().catch(()=>{});}
function tone(f,d,type='square',v=.07,slide=0,delay=0){if(muted||!AC)return;try{const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.02);}catch(e){}}
function noise(d,v=.15,freq=800,delay=0){if(muted||!AC)return;try{const t=AC.currentTime+delay,n=Math.floor(AC.sampleRate*d),b=AC.createBuffer(1,n,AC.sampleRate),ch=b.getChannelData(0);for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=AC.createBufferSource();s.buffer=b;const fl=AC.createBiquadFilter();fl.type='bandpass';fl.frequency.value=freq;fl.Q.value=.8;const g=AC.createGain();g.gain.value=v;s.connect(fl).connect(g).connect(AC.destination);s.start(t);}catch(e){}}
const SFX={
 hit:()=>{noise(.12,.35,500);tone(110,.09,'square',.06,-50);},
 block:()=>{tone(1100,.04,'square',.04);noise(.04,.1,3000);},
 whoosh:()=>noise(.07,.07,2400),
 special:()=>tone(260,.28,'sawtooth',.05,520),
 ko:()=>tone(220,.7,'sawtooth',.09,-180),
 fatal:()=>{noise(.9,.45,250);tone(70,1,'square',.09,-30);},
 fight:()=>{tone(196,.14,'square',.07);tone(392,.3,'square',.07,0,.14);},
 coin:()=>{tone(988,.07,'square',.05);tone(1319,.14,'square',.05,0,.07);},
 bad:()=>tone(160,.45,'triangle',.08,-90),
 good:()=>{tone(523,.1,'triangle',.07);tone(659,.1,'triangle',.07,0,.1);tone(784,.2,'triangle',.07,0,.2);},
 sel:()=>tone(660,.05,'square',.03),
 zap:()=>{noise(.3,.4,4000);tone(1500,.25,'sawtooth',.05,-1300);},
 finish:()=>{tone(110,.5,'sawtooth',.08,40);tone(82,.7,'square',.06,0,.15);},
 fatalVoice:()=>{tone(98,.35,'sawtooth',.09);tone(73,.35,'sawtooth',.09,0,.33);tone(55,.8,'sawtooth',.09,-10,.66);}
};

// ======================================================================
// Drawing primitives (crisp pixels)
// ======================================================================
function px(c,x,y,w,h,col){c.fillStyle=FLASHCOL||col;c.fillRect(Math.round(x),Math.round(y),Math.max(1,Math.round(w)),Math.max(1,Math.round(h)));}
function line(c,x0,y0,x1,y1,w,col){c.fillStyle=FLASHCOL||col;const dx=x1-x0,dy=y1-y0,n=Math.max(1,Math.ceil(Math.max(Math.abs(dx),Math.abs(dy))));const o=Math.floor(w/2);for(let i=0;i<=n;i++)c.fillRect(Math.round(x0+dx*i/n)-o,Math.round(y0+dy*i/n)-o,w,w);}
function circ(c,cx,cy,r,col){c.fillStyle=FLASHCOL||col;for(let y=-r;y<=r;y++){const w=Math.round(Math.sqrt(Math.max(0,r*r-y*y)));c.fillRect(Math.round(cx-w),Math.round(cy+y),w*2||1,1);}}
const _sh={};
function shade(h,k){const key=h+k;if(_sh[key])return _sh[key];const n=parseInt(h.slice(1),16);const r=Math.min(255,Math.round(((n>>16)&255)*k)),g=Math.min(255,Math.round(((n>>8)&255)*k)),b=Math.min(255,Math.round((n&255)*k));return _sh[key]=`rgb(${r},${g},${b})`;}
function txt(c,s,x,y,size,col,align='center',sh='#000'){c.font=`${size}px "Press Start 2P", monospace`;c.textAlign=align;c.textBaseline='middle';if(sh){c.fillStyle=sh;const o=Math.max(1,Math.round(size/8));c.fillText(s,x+o,y+o);}c.fillStyle=col;c.fillText(s,x,y);}
function bands(c,cols,y0,y1){const h=(y1-y0)/cols.length;cols.forEach((col,i)=>px(c,0,y0+i*h,W,h+1,col));}
function srand(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};}

// ======================================================================
// Game data
// ======================================================================
const CHAMPS=[

  col:{skin:'#d39a68',shirt:'#7a5a3a',pants:'#3b3226',apron:'#5a3a1e',hair:'#2a1a10',beard:'#2a1a10'},
  special:{name:'Hammer Rush',type:'dash',dmg:14,cd:2.6},

  special:{name:'Hex Flask',type:'proj',dmg:12,cd:2.2,pk:'flask',color:'#7fd36b',speed:190},

  special:{name:'Brimstone',type:'proj',dmg:13,cd:2.4,pk:'fire',color:'#ff7a1a',speed:170},
  fatal:{name:'Smite',seq:['F','F','S'],kind:'smite'},
  perk:'Hard days cost the party half as much health.'},
 {key:'cutter',name:'Cutter Malone',title:'Riverboat Gambler',money:1500,mult:1,power:.85,speed:1.2,
  col:{skin:'#e8b88f',shirt:'#efe9da',vest:'#9b1c24',pants:'#2b2b33',hat:'bowler',hatCol:'#1c1c1c',mustache:'#1a1a1a'},
  special:{name:'Ace Toss',type:'proj',dmg:9,cd:1.4,pk:'card',color:'#ffffff',speed:260},
  fatal:{name:"Dead Man's Hand",seq:['B','B','P'],kind:'slice'},
  perk:'Starts rich, and can bluff his way past road agents.'},

const FOES={
 bandit:{name:'Road Agent',rig:'human',hp:70,power:.8,speed:.9,aggr:.5,block:.25,col:{skin:'#c99a6e',shirt:'#8a6a3a',pants:'#4a3a2a',hat:'cowboy',hatCol:'#5a3d22',mask:'#a3222a'},special:{type:'proj',dmg:8,cd:3.4,pk:'knife',speed:220}},
 jumper:{name:'Claim Jumper',rig:'human',hp:85,power:.95,speed:.85,aggr:.6,block:.3,col:{skin:'#d4a07a',shirt:'#5b6b7a',pants:'#3a3326',hat:'miner',hatCol:'#7a6a3a',beard:'#8a7a6a'},special:{type:'dash',dmg:11,cd:3.4}},
 snakeoil:{name:'Doc Venom',rig:'human',hp:75,power:.85,speed:1.05,aggr:.5,block:.35,col:{skin:'#e8c0a0',shirt:'#5a2a6a',pants:'#2a1a2a',hat:'top',hatCol:'#1a1a1a',mustache:'#222'},special:{type:'proj',dmg:10,cd:2.6,pk:'bottle',speed:180}},
 wolf:{name:'Gray Wolf',rig:'beast',size:'small',kind:'wolf',hp:60,power:.8,speed:1.3,aggr:.75,block:0,col:{body:'#86868a',dark:'#55555a',eye:'#ffd23a'},special:{type:'dash',dmg:9,cd:2.4}},
 bison:{name:'Bison Bull',rig:'beast',size:'big',kind:'bison',hp:105,power:1.05,speed:.75,aggr:.45,block:0,col:{body:'#5a3a22',dark:'#3a2414',horn:'#e8e0c8',eye:'#111'},special:{type:'dash',dmg:15,cd:3}},
 grizzly:{name:'Grizzly',rig:'beast',size:'big',kind:'bear',hp:115,power:1.15,speed:.8,aggr:.6,block:0,col:{body:'#6b4423',dark:'#43290f',eye:'#111'},special:{type:'dash',dmg:14,cd:3.2}},
 wraith:{name:'Fever Wraith',rig:'ghost',hp:80,power:.9,speed:1,aggr:.55,block:.2,blood:'#7cff8a',col:{body:'#6fe07c',dark:'#2f8a3a',eye:'#ffffff'},special:{type:'proj',dmg:10,cd:2.5,pk:'miasma',speed:120}},
 varney:{name:'Gentleman Jack Varney',boss:true,rig:'human',scale:1.12,hp:135,power:1.05,speed:1.05,aggr:.65,block:.45,col:{skin:'#e3b48c',shirt:'#e8e2d0',vest:'#1f3a5a',pants:'#202028',hat:'top',hatCol:'#202028',mustache:'#3a2010'},special:{type:'proj',dmg:12,cd:2,pk:'bullet',speed:320}},
 scratch:{name:'Old Scratch',boss:true,rig:'beast',size:'huge',kind:'bear',hp:170,power:1.3,speed:.85,aggr:.62,block:0,col:{body:'#3e2a1a',dark:'#22150a',eye:'#ff2a2a'},special:{type:'dash',dmg:18,cd:2.6}},
 dysentery:{name:'LORD DYSENTERY',boss:true,rig:'ghost',big:true,scale:1.35,hp:200,power:1.25,speed:.95,aggr:.7,block:.35,blood:'#8a7a2a',col:{body:'#8f8033',dark:'#4a3a12',eye:'#ff3030',crown:'#e6b422'},special:{type:'proj',dmg:14,cd:1.8,pk:'bile',speed:170}},
};
const MARKS=[
 {n:'Independence, Missouri',m:0,t:'town'},
 {n:'Kansas River Crossing',m:102,t:'river',depth:[2.2,4.8],width:[600,700],ferry:5},
 {n:'Big Blue River',m:185,t:'river',depth:[1.4,3.8],width:[200,300]},
 {n:'Fort Kearney',m:304,t:'fort'},
 {n:'Chimney Rock',m:554,t:'rock',desc:'A spire of clay and sandstone rises 300 feet from the plain. Emigrants carve their names at its base.'},
 {n:'Fort Laramie',m:640,t:'fort'},
 {n:'Independence Rock',m:830,t:'rock',desc:'A great granite whale of a rock. Arrive by the Fourth of July, they say, or you will meet the snows.'},
 {n:'South Pass',m:932,t:'pass',boss:'varney'},
 {n:'Fort Bridger',m:989,t:'fort'},
 {n:'Soda Springs',m:1151,t:'rock',desc:'Bubbling springs that taste like beer gone flat. Your oxen are not impressed.'},
 {n:'Fort Hall',m:1208,t:'fort'},
 {n:'Snake River Crossing',m:1390,t:'river',depth:[4,7],width:[900,1100],guide:25},
 {n:'Fort Boise',m:1504,t:'fort'},
 {n:'Blue Mountains',m:1680,t:'mtn',boss:'scratch'},
 {n:'The Dalles',m:1828,t:'town',boss:'dysentery'},
 {n:'Willamette Valley, Oregon',m:1907,t:'end'},
];
const TOTAL=1907;
const DISEASES=['dysentery','cholera','typhoid','measles','mountain fever','the ague'];
const NAMES=['Ada','Silas','Mae','Jedediah','Clara','Amos','Eliza','Hiram','Ruth','Obadiah','Nell','Cyrus','Tillie','Ezra','Lottie','Wendell','Josie','Abner','Pearl','Thaddeus'];
const PACE=['steady','strenuous','grueling'],RAT=['filling','meager','bare bones'];
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const TIPS=[
 "A trapper spits: \"Gentleman Jack Varney holds South Pass. Rest up before you face him, or pay his toll.\"",
 "\"Old Scratch is the biggest grizzly in the Blue Mountains. They say he's et forty men and a piano.\"",
 "A pale emigrant whispers: \"Lord Dysentery waits at The Dalles. He's what's been killin' all of us.\"",
 "\"Out of medicine? Fight the fever wraith yourself. Beat it and the fever breaks.\"",
 "\"Hold DOWN to block. Punch while blocking and you'll throw a rising uppercut.\"",
 "\"When a foe staggers, you've got a few heartbeats to finish 'em proper. Every champion's got a killing art.\"",
 "\"A grueling pace gets you there faster. If you live.\"",
 "\"Ford a river deeper than three feet and you'll be fishing your flour out of it.\"",

 "\"Kick from the air if they keep blocking low. Nobody blocks a boot to the face from above.\"",
];

// ======================================================================
// State & helpers
// ======================================================================
let G=null,scene='title',sceneT=0,CUR=[],SEL=0,F=null,GRAVE=null;
let best=0;try{best=+localStorage.getItem('mortalTrailBest')||0;}catch(e){}
function showBest(){document.getElementById('best').textContent=best?`Best: ${best}`:'';}
showBest();
function leader(){return G.party.find(p=>p.alive);}
function alive(){return G.party.filter(p=>p.alive);}
function fmtDate(d){return `${MONTHS[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;}
function log(s){G.log.push(s);if(G.log.length>30)G.log.shift();}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function hpCol(h){return h>66?'#7fd36b':h>40?'#e6b422':h>20?'#ff8a3a':'#c3171d';}
function hpWord(h){return h>75?'good':h>50?'fair':h>25?'poor':'very poor';}

function optsHTML(opts){CUR=opts;return `<div class="opts">${opts.map((o,i)=>`<button class="opt${o.hot?' hot':''}" data-i="${i}" ${o.dis?'disabled':''}><span class="k">${o.sp?'␣':i+1}.</span>${o.t}</button>`).join('')}</div>`;}
function view(html,opts){panel.innerHTML=html+(opts?optsHTML(opts):'');if(!opts)CUR=[];}
panel.addEventListener('click',e=>{audio();const b=e.target.closest('button[data-i]');if(!b||b.disabled)return;const o=CUR[+b.dataset.i];if(o){SFX.sel();o.f();}});

// ======================================================================
// Input
// ======================================================================
const KEYS={};let pressQ=[];
const KMAP={ArrowLeft:'L',KeyA:'L',ArrowRight:'R',KeyD:'R',ArrowUp:'U',KeyW:'U',ArrowDown:'D',KeyS:'D',KeyJ:'P',KeyZ:'P',KeyK:'K',KeyX:'K',KeyL:'S',KeyC:'S'};
document.addEventListener('keydown',e=>{
 audio();
 const inInput=e.target&&e.target.tagName==='INPUT';
 if(scene==='fight'&&F&&KMAP[e.code]){e.preventDefault();const k=KMAP[e.code];if(!KEYS[k]||!e.repeat){if(!e.repeat)pressQ.push(k);}KEYS[k]=true;}
 if(inInput){if(e.key==='Enter'&&CUR.length){const o=CUR.find(o=>o.sp)||CUR[0];o&&!o.dis&&o.f();}return;}
 if(e.code==='KeyM'){toggleSound();return;}
 if(scene==='select'&&(e.code==='ArrowLeft'||e.code==='ArrowRight')){e.preventDefault();SEL=(SEL+(e.code==='ArrowLeft'?3:1))%4;selectView();return;}

function humanPose(f,t){
 const P={hip:[0,-22],neck:[0,-37],head:[1,-43],kB:[-3,-11],fB:[-6,0],kF:[4,-11],fF:[7,0],eB:[-2,-30],hB:[5,-33],eF:[6,-29],hF:[11,-33]};
 const st=f.state,a=f.atk,br=Math.sin(t*4+(f.isPlayer?0:2))*.6;
 P.neck[1]+=br*.5;P.head[1]+=br*.5;P.hB[1]+=br;P.hF[1]+=br;
 if(st==='walk'){const w=Math.sin(f.walkT*11);P.kB=[-1-w*3,-11];P.fB=[-2-w*7,0];P.kF=[2+w*3,-11];P.fF=[3+w*7,0];P.hip=[0,-22-Math.abs(w)];}
 if(st==='block'){P.hip=[0,-19];P.kB=[-5,-9];P.fB=[-7,0];P.kF=[5,-10];P.fF=[6,0];P.neck=[1,-34];P.head=[1,-40];P.eB=[5,-29];P.hB=[8,-38];P.eF=[8,-27];P.hF=[10,-36];}
 if(st==='jump'||(!f.onGround&&!a&&st!=='hit')){P.kB=[-1,-16];P.fB=[-5,-8];P.kF=[6,-18];P.fF=[4,-9];P.eB=[-4,-33];P.hB=[-4,-40];P.eF=[7,-36];P.hF=[12,-40];}
 if(st==='hit'){P.neck=[-3,-36];P.head=[-5,-41];P.eB=[-7,-30];P.hB=[-10,-36];P.eF=[-1,-28];P.hF=[2,-22];}
 if(st==='dizzy'){const w=Math.sin(t*5)*2;P.neck=[w,-36];P.head=[w*1.5,-42];P.eB=[-4,-28];P.hB=[-5,-21];P.eF=[4,-28];P.hF=[5,-21];}
 if(st==='win'){P.eF=[5,-44];P.hF=[6,-53];P.eB=[-4,-30];P.hB=[-3,-24];}
 if(a){const ph=atkPhase(f);
  switch(a.kind){
   case 'punch':if(ph===0){P.eF=[2,-31];P.hF=[4,-34];}else if(ph===1){P.eF=[12,-34];P.hF=[21,-35];P.neck=[3,-37];P.head=[4,-43];}else{P.eF=[9,-31];P.hF=[14,-34];}break;
   case 'kick':P.neck=[-3,-36];P.head=[-4,-42];if(ph===0){P.kF=[6,-18];P.fF=[4,-10];}else if(ph===1){P.hip=[0,-23];P.kF=[11,-20];P.fF=[24,-24];}else{P.kF=[8,-15];P.fF=[10,-6];}break;
   case 'upper':if(ph===0){P.hip=[0,-17];P.neck=[2,-31];P.head=[3,-37];P.kB=[-5,-8];P.kF=[6,-8];P.eF=[6,-22];P.hF=[8,-17];}else if(ph===1){P.neck=[2,-38];P.head=[3,-44];P.eF=[8,-42];P.hF=[11,-53];}else{P.eF=[7,-38];P.hF=[9,-46];}break;
   case 'jkick':P.kF=[8,-16];P.fF=[20,-14];P.kB=[-3,-14];P.fB=[-7,-8];P.eB=[-5,-32];P.hB=[-9,-36];break;
   case 'jpunch':P.kB=[-1,-16];P.fB=[-5,-8];P.kF=[6,-18];P.fF=[4,-9];P.eF=[10,-36];P.hF=[19,-30];break;
   case 'dash':P.neck=[6,-35];P.head=[8,-40];P.eF=[13,-31];P.hF=[22,-31];P.kB=[-6,-9];P.fB=[-12,0];P.kF=[7,-12];P.fF=[9,0];break;
   case 'cast':if(ph===0){P.eF=[-4,-36];P.hF=[-8,-42];P.neck=[-1,-37];}else{P.eF=[9,-36];P.hF=[18,-38];P.neck=[3,-37];P.head=[4,-43];}break;
  }}
 return P;
}

 }
 L(sh,P.eF,3,shirt);L(P.eF,P.hF,3,shirt);

 if(f.atk&&f.atk.kind==='dash'&&d.key==='josiah'){L(P.hF,[P.hF[0]+2,P.hF[1]-9],2,'#6a4a2a');rect(P.hF[0]-1,P.hF[1]-13,8,5,'#9a9aa2');}

const BSZ={small:{L:28,B:9,leg:9,hw:9,hh:7},big:{L:38,B:15,leg:11,hw:12,hh:10},huge:{L:50,B:21,leg:14,hw:15,hh:13}};
function drawBeast(c,f,bx,by,t){
 const d=f.def,col=d.col,z=BSZ[d.size],s=f.scale,fc=f.facing;
 const rect=(lx,ly,w,h,cl)=>{const x=fc>0?bx+lx*s:bx-(lx+w)*s;px(c,x,by+ly*s,w*s,h*s,cl);};
 const L=(a,b,w,cl)=>line(c,bx+a[0]*fc*s,by+a[1]*s,bx+b[0]*fc*s,by+b[1]*s,Math.max(1,Math.round(w*s)),cl);
 const walk=f.state==='walk'?Math.sin(f.walkT*13):0;
 const a=f.atk,ph=a?atkPhase(f):-1;
 let hx=0,hy=0,jaw=0,lift=0,lean=0;
 if(a){if(a.kind==='bite'){if(ph===0)hx=-3;else if(ph===1){hx=7;jaw=1;}else hx=2;}
  if(a.kind==='swipe'){if(ph===0){lift=1;hy=-2;}else if(ph===1){lift=2;hx=3;jaw=1;}}
  if(a.kind==='dash'){hx=5;hy=3;lean=1;jaw=1;}}
 if(f.state==='hit'){hx=-4;hy=-2;}
 if(f.state==='dizzy'){hy=Math.sin(t*5)*2;hx=Math.cos(t*5);}
 const top=-z.leg-z.B,x0=-z.L/2;
 if(d.kind==='wolf')L([x0+1,top+2],[x0-8,top-3+walk],3,col.body);else L([x0+1,top+3],[x0-3,top+8],1,col.dark);
 const lg=(lx,dir,dark)=>{const sw=walk*3*dir+(lean?(dir>0?4:-4):0);rect(lx+sw,-z.leg,4,z.leg,dark?col.dark:col.body);rect(lx+sw,-2,4,2,'#1a120c');};
 lg(x0+3,1,true);lg(z.L/2-9,-1,true);
 rect(x0,top,z.L,z.B,col.body);
 if(d.kind==='bison'){rect(z.L*.05,top-5,z.L*.42,z.B+5,col.dark);}
 if(d.kind==='bear'){rect(z.L*.05,top-4,z.L*.35,5,col.body);}
 rect(x0+2,top+z.B-3,z.L-4,3,col.dark);
 lg(x0+7,-1,false);
 if(lift){L([z.L/2-6,top+z.B-2],[z.L/2+5+lift*3,top+3-lift*3],4,col.body);rect(z.L/2+5+lift*3,top+1-lift*3,3,3,'#e8e0c8');}
 else lg(z.L/2-5,1,false);
 const low=d.kind==='bison'?5:0;
 const hX=z.L/2-3+hx,hY=top-2+hy+low;
 rect(hX,hY,z.hw,z.hh,d.kind==='bison'?col.dark:col.body);
 rect(hX+z.hw-1,hY+z.hh*.35,Math.ceil(z.hw*.45),Math.ceil(z.hh*.5),d.kind==='wolf'?col.body:shade(col.body,.7));
 rect(hX+z.hw+Math.ceil(z.hw*.45)-2,hY+z.hh*.35,2,2,'#111');
 rect(hX+z.hw-4,hY+2,2,2,col.eye);
 if(d.kind==='wolf'){rect(hX+1,hY-4,2,4,col.body);rect(hX+4,hY-3,2,3,col.dark);}
 if(d.kind==='bear'){rect(hX,hY-2,3,3,col.body);rect(hX+5,hY-2,3,3,col.body);}
 if(d.kind==='bison'){rect(hX+3,hY-3,2,3,col.horn);rect(hX+1,hY-5,3,2,col.horn);}
 if(jaw){rect(hX+z.hw-1,hY+z.hh-1,Math.ceil(z.hw*.5),3,'#a01818');rect(hX+z.hw,hY+z.hh-1,1,1,'#fff');rect(hX+z.hw+2,hY+z.hh-1,1,1,'#fff');}
}
function drawFighterAt(c,f,x,y,t){
 const st=f.state;
 if(st==='ko'){
  const p=clamp(f.kot/.45,0,1);
  c.save();
  if(f.def.rig==='beast'){const z=BSZ[f.def.size];const cy=y-(z.leg+z.B)/2*f.scale;c.translate(x,cy);c.rotate(Math.PI*p*f.facing);c.translate(-x,-cy);}
  else{c.translate(x,y);c.rotate(-f.facing*Math.PI/2*p);c.translate(-x,-y);}
  if(f.def.rig==='beast')drawBeast(c,f,x,y,t);else drawHuman(c,f,x,y,t);

const ATK={
 punch:{su:.05,ac:.08,rc:.12,reach:16,y:[28,42],dmg:6,kb:60,stun:.22},
 kick:{su:.1,ac:.1,rc:.2,reach:22,y:[14,34],dmg:9,kb:110,stun:.3},
 upper:{su:.08,ac:.1,rc:.3,reach:14,y:[26,56],dmg:12,kb:70,stun:.55,launch:-300},
 jkick:{su:.04,ac:9,rc:0,reach:18,y:[4,30],dmg:9,kb:100,stun:.3,air:true},
 jpunch:{su:.04,ac:9,rc:0,reach:16,y:[10,40],dmg:7,kb:80,stun:.25,air:true},
 dash:{su:.12,ac:.3,rc:.25,reach:12,y:[4,44],dmg:0,kb:170,stun:.45},
 cast:{su:.16,ac:.05,rc:.25,reach:0,y:[0,0]},
 bite:{su:.08,ac:.1,rc:.16,reach:16,y:[2,40],dmg:7,kb:70,stun:.25},
 swipe:{su:.15,ac:.12,rc:.25,reach:22,y:[2,44],dmg:11,kb:120,stun:.35},
};
function makeFighter(def,x,facing,isPlayer,mul=1){
 const s=(def.scale||1)*mul;let hw=8,h=46;
 if(def.rig==='beast'){const z=BSZ[def.size];hw=z.L/2;h=z.leg+z.B+4;}
 if(def.big){hw=10;}
 return{def,x,y:GY,vx:0,vy:0,facing,isPlayer,hp:def.hp,maxHp:def.hp,shownHp:def.hp,state:'idle',atk:null,cd:0,scale:s,hw:hw*s,h:h*s,walkT:0,stun:0,kot:0,ai:{t:.6,mode:'idle',hold:0},onGround:true,flash:0,hidden:false};
}
function atkPhase(f){const a=f.atk,d=a.d;if(a.t<d.su)return 0;if(d.air)return f.onGround?2:1;if(a.t<d.su+d.ac)return 1;return 2;}
function startAtk(f,kind){f.atk={kind,d:ATK[kind],t:0,hit:false,spawned:false};f.state='atk';if(kind!=='cast')SFX.whoosh();if(f.onGround&&kind!=='dash')f.vx*=.3;}
function special(f){const sp=f.def.special;if(!sp||f.cd>0)return;f.cd=sp.cd;startAtk(f,sp.type==='dash'?'dash':'cast');if(sp.type==='dash')SFX.special();}
function hurtbox(f){const h=f.state==='block'?f.h*.85:f.h;return{x0:f.x-f.hw,x1:f.x+f.hw,y0:f.y-h,y1:f.y};}
function tryHit(att,def){
 const a=att.atk,d=a.d,s=att.scale;
 const xa=att.x+att.facing*att.hw*.2,xb=att.x+att.facing*(att.hw+d.reach*s);
 const hb={x0:Math.min(xa,xb),x1:Math.max(xa,xb),y0:att.y-d.y[1]*s,y1:att.y-d.y[0]*s};
 const hu=hurtbox(def);
 if(hb.x0<hu.x1&&hb.x1>hu.x0&&hb.y0<hu.y1&&hb.y1>hu.y0){
  a.hit=true;
  const dmg=(a.kind==='dash'?att.def.special.dmg:d.dmg)*att.def.power;
  applyHit(att,def,dmg,d.kb,d.stun,d.launch||0,att.x);
 }
}
function applyHit(att,def,dmg,kb,stun,launch,srcX){
 if(!F||def.state==='ko'||F.phase==='over'||F.phase==='fatality'||F.phase==='intro')return;
 const dir=def.x>=srcX?1:-1;
 if(F.phase==='finish'){
  if(def===F.foe){def.state='ko';def.kot=0;def.vx=dir*90;SFX.hit();SFX.ko();blood(def,18,dir);F.shake=.2;endFight('win',false);}
  return;
 }
 const blocking=def.state==='block'&&def.facing===-dir;
 if(blocking){dmg*=.15;def.vx=dir*kb*.45;SFX.block();F.fx.push({x:def.x-dir*def.hw,y:def.y-def.h*.7,t:0,col:'#fff'});}
 else{
  def.state='hit';def.atk=null;def.stun=stun;def.vx=dir*kb;
  if(launch){def.vy=launch;def.onGround=false;}
  SFX.hit();blood(def,dmg,dir);F.shake=Math.max(F.shake,.08+dmg*.006);def.flash=.08;F.hitstop=.045;
  if(att===F.pl){F.combo=F.comboOpen?F.combo+1:1;F.comboOpen=true;if(F.combo>=3){F.comboTxt=`${F.combo} HIT COMBO`;F.comboT=1.1;}}
 }
 def.hp=Math.max(0,def.hp-dmg);
 if(def.hp<=0){
  if(def===F.foe){F.phase='finish';F.ft=5;def.state='dizzy';def.atk=null;def.vx=0;F.proj=[];F.msg=F.foe.def.rig==='beast'?'FINISH IT!':'FINISH THEM!';F.msgT=99;SFX.finish();F.inputs=[];}
  else{def.state='ko';def.kot=0;def.atk=null;F.foe.state='win';F.foe.atk=null;SFX.ko();endFight('lose',false);}
 }
}
function blood(f,amt,dir){
 const col=f.def.blood||'#c3171d';const n=Math.round(4+amt*1.4);
 for(let i=0;i<n;i++)F.parts.push({x:f.x+Rn(-4,4),y:f.y-f.h*Rn(.45,.85),vx:dir*Rn(20,140)+Rn(-30,30),vy:Rn(-170,-30),life:Rn(.6,1.4),col:Math.random()<.4?shade(col,.65):col,sz:Math.random()<.3?2:1,stick:true});
}
function spawnProj(f){
 const sp=f.def.special;const y=f.y-(f.def.rig==='beast'?f.h*.6:32*f.scale);
 F.proj.push({x:f.x+f.facing*(f.hw+6),y,vx:f.facing*(sp.speed||200),owner:f,dmg:sp.dmg*f.def.power,pk:sp.pk,col:sp.color,t:0});
 SFX.special();
}
function aiInput(e,p,dt){
 const inp={L:0,R:0,U:0,D:0,pr:new Set()};
 if(F.phase!=='fight'||p.state==='ko'||e.state==='hit')return inp;
 const A=e.ai,d=e.def;
 const gap=Math.abs(p.x-e.x)-(p.hw+e.hw);
 const tw=p.x>e.x?'R':'L',aw=tw==='R'?'L':'R';
 A.t-=dt;
 if(A.t<=0&&!e.atk){
  A.t=Rn(.16,.4)*(1.3-d.aggr*.6);A.mode='idle';A.hold=0;
  const threat=(p.atk&&gap<36&&atkPhase(p)<2)||F.proj.some(q=>q.owner===p&&Math.abs(q.x-e.x)<90&&Math.sign(e.x-q.x)===Math.sign(q.vx));
  const r=Math.random();
  if(threat&&d.block>0&&r<d.block+.15){A.mode='block';A.hold=Rn(.25,.5);}
  else if(gap>16){
   const sp=d.special;
   if(e.cd<=0&&sp&&((sp.type==='proj'&&gap>50&&r<.35)||(sp.type==='dash'&&gap<120&&r<.3)))inp.pr.add('S');
   else if(r<.07&&d.rig==='human'){inp.pr.add('U');A.mode='walk';A.hold=.45;}
   else{A.mode='walk';A.hold=Rn(.2,.5);}
  }else{
   if(r<d.aggr){const q=Math.random();inp.pr.add(q<.45?'P':q<.82?'K':'UP');}

function act(f,inp,other){

  if(inp.D){if(pr.has('P')){startAtk(f,beast?'swipe':'upper');return;}f.state='block';f.vx=0;return;}
  if(pr.has('P')){startAtk(f,beast?'bite':'punch');return;}
  if(pr.has('K')){startAtk(f,beast?'swipe':'kick');return;}
  const mv=(inp.R?1:0)-(inp.L?1:0);
  const spd=96*f.def.speed;

// ======================================================================
// Main loop
// ======================================================================
let last=performance.now();
const DAY=.55;
function loop(now){
 const dt=clamp((now-last)/1000,0,.05);last=now;sceneT+=dt;
 try{
  if(scene==='fight'&&F)updateFight(dt);
  if(scene==='travel'&&G&&G.moving){G.scroll+=dt*60;G.acc+=dt;if(G.acc>=DAY){G.acc=0;const stop=dayTick();if(!stop&&scene==='travel')updTravelStats();}}
  if(scene==='title')drawTitle(sceneT);
  else if(scene==='select')drawSelect(sceneT);
  else if(scene==='travel'&&G)drawTravel(sceneT);
  else if(scene==='fight'&&F)drawFight();
  else if(scene==='grave')drawGrave(sceneT);
  else if(scene==='won')drawEnd(sceneT,true);
  else if(scene==='over')drawEnd(sceneT,false);
 }catch(e){console.error(e);}
 requestAnimationFrame(loop);
}

function milesPerDay(){

 if((G.miles>880&&G.miles<1000)||(G.miles>1580&&G.miles<1760))m*=.75;

function healthTick(resting){
 const al=alive();const out={sick:[],dead:[]};if(!al.length)return out;
 const need=al.length*[2,1.5,1][G.rations];let starving=false;
 if(G.food>=need)G.food-=need;else{G.food=0;starving=true;}
 for(const p of al){
  let d=resting?5:.5;
  let neg=[.8,0,-1.5][G.rations]+(resting?0:[0,-1.2,-2.8][G.pace])+(starving?-6:0);
  if(neg<0&&G.champ.key==='ezekiel')neg*=.5;
  d+=neg;
  if(p.sick){d-=resting?1.5:Rn(3,5.5);if(Math.random()<(resting?.3:.07)){log(`${esc(p.name)} has recovered from ${p.sick}.`);p.sick=null;}}
  else{let ch=.008+(G.rations===2?.01:0)+(G.pace===2?.01:0)+(p.hp<50?.012:0)+(starving?.03:0);if(resting)ch*=.3;if(Math.random()<ch){p.sick=pick(DISEASES);out.sick.push(p);}}
  p.hp=clamp(p.hp+d,0,100);
  if(p.hp<=0){p.alive=false;p.cause=p.sick||(starving?'starvation':'exhaustion');out.dead.push(p);G.dead.push(p);}
 }
 if(starving)log('<span class="red">You have run out of food!</span>');
 return out;
}

}

function arrive(){
 G.moving=false;const m=MARKS[G.next];G.at=G.next;G.next++;
 log(`You arrive at ${m.n}.`);
 if(m.t==='river'||(m.boss&&!G.beaten[m.boss]))G.block=m;
 if(m.t==='end'){victory();return;}
 if(m.boss&&!G.beaten[m.boss]){bossView(m);return;}

}
function landmarkView(m,note){
 scene='travel';
 if(m.t==='river'){riverView(m);return;}
 if(m.t==='fort'){fortView(m,note);return;}
 const desc=m.desc||(m.t==='pass'?'The Continental Divide. From here, the rivers run to the Pacific.':m.t==='mtn'?'Steep switchbacks and dark pine. The Columbia lies beyond.':m.n==='The Dalles'?'The trail ends at the Columbia River. Oregon City is a raft ride away.':'');
 view(`${note?`<div class="note good">${note}</div>`:''}<h2>${m.n}</h2><p>${desc}</p><p class="dim">${fmtDate(G.date)}</p>`,[{t:'Continue on the trail',sp:true,hot:true,f:()=>{travelView();goTrail();}},{t:'Rest here',f:()=>restView()},{t:'Back to the wagon',f:()=>travelView()}]);
}
function fortView(m,note){
 const idx=MARKS.filter(x=>x.t==='fort').indexOf(m);const mult=1+.25*(idx+1);
 view(`${note?`<div class="note${note.good?' good':''}">${note.t||note}</div>`:''}<h2>${m.n}</h2><p>A trading post with high prices and loud opinions.</p>`,
 [{t:'Continue on the trail',sp:true,hot:true,f:()=>{travelView();goTrail();}},{t:'Buy supplies',f:()=>storeView(mult,`${m.n} — trading post`,false,()=>fortView(m))},{t:'Talk to people',f:()=>fortView(m,{t:pick(TIPS)})},{t:'Rest here',f:()=>restView()}]);
}
function riverView(m){
 if(!G.river||G.river.at!==m.n)G.river={at:m.n,depth:+Rn(m.depth[0],m.depth[1]).toFixed(1),width:RI(m.width[0],m.width[1])};
 const r=G.river;
 const o=[{t:'Attempt to ford the river',f:()=>cross('ford')},{t:'Caulk the wagon and float it across',f:()=>cross('float')}];
 if(m.ferry)o.push({t:`Take a ferry ($${m.ferry})`,dis:G.money<m.ferry,f:()=>{G.money-=m.ferry;G.block=null;const d=RI(1,3);let msg=`You wait ${d} day${d>1?'s':''} and the ferry takes you safely across.`;for(let i=0;i<d;i++){const h=passDay(false);if(handleHealth(h,()=>travelView(msg,true)))return;}travelView(msg,true);}});
 if(m.guide)o.push({t:`Hire a local guide ($${m.guide})`,dis:G.money<m.guide,f:()=>{G.money-=m.guide;G.block=null;travelView('A guide leads you across a safe crossing.',true);}});
 o.push({t:'Wait a day to see if conditions improve',f:()=>{const h=passDay(true);r.depth=+clamp(r.depth+Rn(-.6,.4),1,9).toFixed(1);if(!handleHealth(h,()=>riverView(m)))riverView(m);}});
 view(`<h2>${m.n}</h2><p>The river is <b>${r.width} feet</b> across and <b>${r.depth} feet</b> deep${r.depth>3?' — <span class="red">too deep to ford safely</span>':''}.</p>`,o);
}
function cross(how){
 const r=G.river;let bad=0;
 if(how==='ford')bad=r.depth<2.5?0:r.depth<3.5?.35:.7;
 else bad=r.depth<1.5?.5:.2;
 if(how==='float'&&r.depth<1.5&&Math.random()<bad){const h=passDay(false);if(!handleHealth(h,()=>travelView()))travelView('The river is too shallow to float. You get stuck in the mud and lose a day.');return;}
 G.block=null;
 if(Math.random()>=bad){log('You crossed the river.');travelView('You make it across safely.',true);return;}
 const fd=Math.round(G.food*Rn(.15,.35)),md=Math.min(G.meds,RI(0,1)),pt=Math.min(G.parts,RI(0,1));G.food-=fd;G.meds-=md;G.parts-=pt;
 let msg=`The wagon tips over! You lose ${fd} lb of food${md?', a medicine kit':''}${pt?', a spare part':''}.`;
 const others=alive().filter(p=>p!==leader());
 if(others.length&&Math.random()<(how==='ford'?.18:.08)){const v=pick(others);v.alive=false;v.cause='drowning';v.hp=0;G.dead.push(v);log(`<span class="red">${esc(v.name)} has drowned.</span>`);SFX.bad();graveView(v,()=>travelView(msg));return;}
 SFX.bad();log('Lost supplies in the river.');travelView(msg);
}
const BOSS={
 varney:{intro:'A dandy in a silk top hat steps out from the rocks, flanked by a dozen gunmen. “Gentleman Jack Varney, at your service. Nobody crosses my pass without paying the toll — or proving they deserve to.” He hands his rifle to a crony and rolls up his sleeves.',toll:true},
 scratch:{intro:'The pines go silent. Something enormous is following the wagon. Old Scratch, the man-eating grizzly of the Blue Mountains, steps onto the trail. There is no going around him.'},
 dysentery:{intro:'The Columbia is in sight. Then the air turns foul. A bloated, crowned specter rises from the latrine pits of a thousand camps: LORD DYSENTERY, killer of emigrants. “Every wagon pays me in the end.”'},
};
function bossView(m,note){
 scene='travel';const b=BOSS[m.boss],L=leader();
 const o=[{t:`Fight ${FOES[m.boss].name}`,hot:true,f:()=>bossFight(m)},{t:'Make camp and rest first <span class="dim">(1 day)</span>',f:()=>doRest(1,()=>bossView(m,'You rest. The boss waits. They always wait.'))}];
 if(b.toll){const toll=Math.max(50,Math.round(G.money*.5));o.push({t:`Pay Varney's toll ($${toll})`,dis:G.money<toll,f:()=>{G.money-=toll;G.beaten.varney=true;G.block=null;log(`Paid Varney $${toll}.`);landmarkView(m,'Varney pockets the cash. “A pleasure.”');}});}
 view(`${note?`<div class="note">${note}</div>`:''}<h2 class="red">${m.n}</h2><p>${b.intro}</p><p class="dim">${esc(L.name)}: ${hpWord(L.hp)} health (${Math.round(L.hp)}/100). ${L.hp<60?'<span class="red">You might want to rest first.</span>':''}</p>`,o);
}
function bossFight(m){
 const key=m.boss,bg=key==='dysentery'?'hell':undefined;
 startFight(key,{bg,intro:key==='dysentery'?'The final battle of the Oregon Trail.':''},(won,fatal)=>{
  const L=leader();
  if(won){G.beaten[key]=true;G.block=null;const g=key==='varney'?150:key==='scratch'?60:200,fd=key==='scratch'?300:key==='dysentery'?0:50;G.money+=g*(fatal?2:1);G.food+=fd;SFX.good();
   log(`<span class="gold">Defeated ${FOES[key].name}!</span>`);
   const msg={varney:`Varney's gang carries him off. You claim his strongbox: <b>$${g*(fatal?2:1)}</b>.`,scratch:`Old Scratch will eat no more emigrants. <b>${fd} lb</b> of meat.`,dysentery:`Lord Dysentery is destroyed. Nobody will ever die of dysentery again. (Probably.)`}[key];
   landmarkView(m,msg);return;}
  if(key==='varney'){const lost=Math.round(G.money*.5);G.money-=lost;L.hp=5;G.beaten.varney=true;G.block=null;log(`Varney took $${lost}.`);landmarkView(m,`Varney admires your grit, takes <b>$${lost}</b>, and lets you limp through the pass.`);return;}
  L.alive=false;L.hp=0;L.cause=key==='scratch'?'being eaten by a bear':'dysentery';G.dead.push(L);log(`<span class="red">${esc(L.name)} has died of ${L.cause}.</span>`);
  graveView(L,()=>bossView(m,`${esc(L.name)} is gone. ${FOES[key].name} still blocks the way.`));
 });
}
function score(){const al=alive();return Math.round((al.length*500+al.reduce((s,p)=>s+p.hp,0)*2+G.food/2+G.money+G.fatals*150+G.kills*40+G.oxen*20)*G.champ.mult);}
function victory(){
 scene='won';sceneT=0;SFX.good();const s=score();let nb=false;if(s>best){best=s;nb=true;try{localStorage.setItem('mortalTrailBest',s);}catch(e){}showBest();}
 const al=alive();
 view(`<h2>You made it to the Willamette Valley!</h2><p>${fmtDate(G.date)}. ${al.length} of 5 survived: ${al.map(p=>esc(p.name)).join(', ')}.</p>
 <p><span class="dim">Foes beaten:</span> ${G.kills} · <span class="dim">Fatalities:</span> ${G.fatals} · <span class="dim">Food left:</span> ${Math.round(G.food)} lb · <span class="dim">Cash:</span> $${G.money}</p>
 <p class="gold">Score: ${s} <span class="dim">(×${G.champ.mult} for ${G.champ.name})</span>${nb?' — <span class="red">new best!</span>':''}</p>`,[{t:'Play again',sp:true,f:()=>{G=null;titleView();}}]);
}
function gameOver(){
 scene='over';sceneT=0;SFX.bad();
 view(`<h2 class="red">Your party has perished on the trail.</h2><p>${G.party.map(p=>`${esc(p.name)} — ${p.cause}`).join('<br>')}</p><p class="dim">You made it ${G.miles} miles. ${G.kills} foes beaten, ${G.fatals} fatalities.</p>`,[{t:'Try again',sp:true,f:()=>{G=null;titleView();}}]);
}

// ======================================================================
titleView();
requestAnimationFrame(loop);
if(document.fonts&&document.fonts.load){document.fonts.load('8px "Press Start 2P"').catch(()=>{});}
</script>
</body>
